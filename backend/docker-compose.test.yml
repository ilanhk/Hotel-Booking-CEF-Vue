# Throwaway Postgres for the integration tests: `npm run test:db:up`.
# tmpfs keeps the data in memory, so the database is empty on every start.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: vacations_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d vacations_test"]
      interval: 2s
      timeout: 3s
      retries: 15
